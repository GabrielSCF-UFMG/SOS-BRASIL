<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Police Blue Gradient (PM) -->
    <linearGradient id="policeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Fire Flame Gradient (BM) -->
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Medical Heart Gradient (SAMU) -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="60%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Base Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Tactical Border Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#policeGrad)" stroke-width="2" opacity="0.3"/>

  <!-- Tri-Service Unified Emblem Core -->
  <g transform="translate(0, 10)">
    
    <!-- 1. POLÍCIA MILITAR (PM): Tactical Shield & Crosshair Security Wings -->
    <!-- Tactical Security Shield Base -->
    <path d="M 256 70 
             L 370 120 
             C 370 230 320 330 256 380 
             C 192 330 142 230 142 120 
             Z" 
          fill="#0f172a" 
          stroke="url(#policeGrad)" 
          stroke-width="12" 
          filter="url(#badgeShadow)"/>

    <!-- Subtle Shield Inner Plate -->
    <path d="M 256 86 
             L 354 130 
             C 354 224 312 310 256 354 
             C 200 310 158 224 158 130 
             Z" 
          fill="#1e293b" 
          opacity="0.75"/>

    <!-- Tactical Crosshair / Star Law Enforcement Marks (PM) -->
    <!-- Top & Side Reticles -->
    <line x1="256" y1="45" x2="256" y2="75" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
    <line x1="120" y1="120" x2="148" y2="120" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
    <line x1="364" y1="120" x2="392" y2="120" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>

    <!-- 2. CORPO DE BOMBEIROS (BM): Dynamic Fire Flame of Rescue -->
    <!-- Large Outer Flame (Orange-Red) -->
    <path d="M 256 125
             C 278 175 330 205 330 265
             C 330 320 290 355 256 355
             C 222 355 182 320 182 265
             C 182 215 220 180 238 140
             C 246 175 270 195 264 220
             C 258 200 248 185 256 125
             Z"
          fill="url(#fireGrad)"
          filter="url(#glowEffect)"/>

    <!-- Inner Golden Core Flame -->
    <path d="M 256 190
             C 270 220 298 245 298 280
             C 298 312 278 335 256 335
             C 234 335 214 312 214 280
             C 214 250 238 225 248 200
             C 252 220 262 230 258 245
             C 255 232 250 222 256 190
             Z"
          fill="#fef08a"/>

    <!-- 3. SAMU 192: Emergency Vital Heart with Pulse Lifeline & Medical Cross -->
    <!-- Foreground Vital Red Heart -->
    <g transform="translate(256, 280) scale(1.15) translate(-256, -280)">
      <path d="M 256 345
               C 225 315 175 275 175 225
               C 175 195 198 172 228 172
               C 245 172 253 182 256 186
               C 259 182 267 172 284 172
               C 314 172 337 195 337 225
               C 337 275 287 315 256 345
               Z"
            fill="url(#heartGrad)"
            stroke="#ffffff"
            stroke-width="5"
            filter="url(#badgeShadow)"/>

      <!-- Heartbeat / EKG Pulse Lifeline (White High Contrast) -->
      <path d="M 188 225 
               L 218 225 
               L 228 205 
               L 242 250 
               L 256 198 
               L 270 238 
               L 280 225 
               L 324 225"
            fill="none"
            stroke="#ffffff"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <!-- Top Police Security 5-Point Golden Star -->
    <polygon points="256,62 262,78 279,78 265,88 270,104 256,94 242,104 247,88 233,78 250,78" 
             fill="url(#goldGrad)" 
             stroke="#78350f" 
             stroke-width="1.5"/>

  </g>

  <!-- Emergency Indicator Badges in Bottom Arc -->
  <g transform="translate(0, 420)">
    <!-- 190 PM Badge -->
    <rect x="90" y="0" width="96" height="34" rx="10" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2"/>
    <text x="138" y="22" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" text-anchor="middle">190 PM</text>

    <!-- 193 BOMBEIROS Badge -->
    <rect x="208" y="0" width="96" height="34" rx="10" fill="#c2410c" stroke="#fb923c" stroke-width="2"/>
    <text x="256" y="22" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" text-anchor="middle">193 BM</text>

    <!-- 192 SAMU Badge -->
    <rect x="326" y="0" width="96" height="34" rx="10" fill="#be123c" stroke="#f43f5e" stroke-width="2"/>
    <text x="374" y="22" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" text-anchor="middle">192 SAMU</text>
  </g>

  <!-- Title Bottom Pill -->
  <text x="256" y="488" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="3" text-anchor="middle">SOS CIDADÃO • BRASIL</text>
</svg>
